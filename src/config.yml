# ==========================================================
#                   Fake-Manhunt config
# ==========================================================
# Edit this file, then run /manhunt reload (or restart the server).
# Every feature can be switched off with enabled: false.

# ----------------------------------------------------------
# /save and /load
# ----------------------------------------------------------
# Autosave is turned off. The world only keeps progress when someone runs /save,
# and /load rolls everything back to that point.
# /load needs the included start.sh to restart and restore the server.
save-load:
  enabled: true
  # Treat the vanilla /save-all command as /save, so it updates the restore point.
  save-all-is-save: true
  # Message shown to players when /load kicks them.
  load-kick-message: "§e[Manhunt] Loading last save...\n§7Rejoin in ~30 seconds."

# ----------------------------------------------------------
# /qsave and /qload
# ----------------------------------------------------------
# Instant save: position, health, hunger, saturation, inventory,
# armor, XP, potion effects, ender chest, plus time and weather.
# Blocks changed since /qsave are rolled back too (chests keep their contents),
# and items, XP, TNT, pearls and boats spawned since then are removed.
# Block changes are kept in memory, so a restart forgets them.
# Mobs are not restored - use /save and /load for a full rollback.
quick-save:
  enabled: true

# ----------------------------------------------------------
# /immortal
# ----------------------------------------------------------
# Two modes:
#   /immortal damage   - you still take hits (knockback, hurt sound, red flash)
#                        but health never drops below min-health. Looks normal in PvP.
#   /immortal nodamage - hits are cancelled completely, no hurt effect at all.
#                        Use it for clutches so a big fall doesn't look suspicious.
# Plain /immortal toggles damage mode. /immortal off turns it off.
immortal:
  enabled: true
  # Lowest health an immortal player can reach. 1.0 = half a heart, 20.0 = full health.
  min-health: 1.0
  # Let /kill still kill immortal players (handy to escape the void).
  allow-kill-command: true

# ----------------------------------------------------------
# /clutch
# ----------------------------------------------------------
# Players with /clutch on never miss a clutch. Right-click with a clutch item while
# falling and the server does the clutch for you right before you land, even if the
# click was a bit early, slightly off the block, or a held click that repeated too slowly.
# Works with: water bucket, powder snow bucket, any boat or raft, slime block,
# hay bale, honey block, cobweb, scaffolding, twisting vines, ender pearl, wind charge.
clutch:
  enabled: true
  # How early a click still counts: within this many blocks of the ground...
  window-blocks: 6
  # ...or within this many ticks of landing (helps on long, fast falls). 20 ticks = 1 second.
  window-ticks: 10
  # Scoop the water back up automatically after a water clutch.
  auto-pickup-water: false
  pickup-delay-ticks: 10
  # Put the player in the boat when they land on it.
  boat-auto-enter: true

# ----------------------------------------------------------
# Boosted piglin bartering
# ----------------------------------------------------------
# Chance (0-100) for each barter to be replaced with the item below.
# Rolled in order; anything left over falls back to the normal vanilla drop.
# Keep the three chances adding up to 100 or less.
# Vanilla rates are roughly: pearl 2.2%, fire resistance 3.5%, obsidian 8.7%.
barter:
  enabled: true
  ender-pearl:
    chance: 50
    min: 4
    max: 8
  fire-resistance:
    chance: 20
    # % of fire resistance drops that are splash potions.
    splash-chance: 30
  obsidian:
    chance: 25
    min: 1
    max: 3
