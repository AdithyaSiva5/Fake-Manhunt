name: FakeManhunt
version: 1.3.1
main: fakemanhunt.FakeManhunt
api-version: '26.1'
description: Manhunt tools - /save and /load the world, /qsave and /qload players, /immortal, /clutch, and boosted piglin bartering.
commands:
  save:
    description: Save the current world state as the restore point
    permission: fakemanhunt.use
  load:
    description: Roll the world back to the last /save
    permission: fakemanhunt.use
  qsave:
    description: Quick save - players' position, health, hunger, inventory and armor (no restart)
    aliases: [quicksave, minisave]
    permission: fakemanhunt.use
  qload:
    description: Quick load - put players back to the last /qsave instantly (world is not reset)
    usage: /qload [player]
    aliases: [quickload, miniload]
    permission: fakemanhunt.use
  immortal:
    description: Immortality - damage mode takes hits but can't die, nodamage mode ignores hits
    usage: /immortal [damage|nodamage|off] [player]
    permission: fakemanhunt.immortal
  clutch:
    description: Clutch assist - every clutch (water, boat, slime, pearl, wind charge...) lands
    usage: /clutch [on|off] [player]
    permission: fakemanhunt.clutch
  manhunt:
    description: Reload the Fake-Manhunt config
    usage: /manhunt reload
    permission: fakemanhunt.reload
permissions:
  fakemanhunt.use:
    default: op
  fakemanhunt.immortal:
    default: op
  fakemanhunt.clutch:
    default: op
  fakemanhunt.reload:
    default: op
