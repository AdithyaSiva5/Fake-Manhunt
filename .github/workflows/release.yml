# Pushing a tag like v1.1.0 publishes a GitHub release with FakeManhunt.jar attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FakeManhunt.jar \
            --title "Fake-Manhunt $GITHUB_REF_NAME" \
            --notes "Download **FakeManhunt.jar** below and put it in your server's \`plugins/\` folder. For \`/load\` to work, also download [\`start.sh\`](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/start.sh) and start the server with it. See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for setup and config."
